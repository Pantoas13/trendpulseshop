name: Fotos ilustrativas

# Fotos con licencia libre (Openverse: CC0, dominio público o CC BY) por tipo de producto. No usa fotos de Amazon.
# Se eligen a ojo en dos pasos (ver scripts/fotos_ilustrativas.py):
#   1. argumentos: --candidatos todos         -> baja opciones a img/candidatos/ (en una rama, sin publicar)
#   2. argumentos: --elegir cafe=1,3 tv=2 --limpiar
# Al terminar en main, "Publicar en Netlify" se lanza solo.

on:
  workflow_dispatch:
    inputs:
      argumentos:
        description: "Argumentos para scripts/fotos_ilustrativas.py (ej.: --candidatos todos)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: fotos-ilustrativas
  cancel-in-progress: false

jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - name: Fotos
        env:
          ARGS: ${{ inputs.argumentos }}
        run: |
          # solo letras, números, espacios, = , y guiones: nada que el shell pueda interpretar
          if ! printf '%s' "$ARGS" | grep -Eq '^[A-Za-z0-9 =,_-]*$'; then echo "Argumentos no válidos"; exit 1; fi
          python scripts/fotos_ilustrativas.py $ARGS
      - name: Guardar
        run: |
          git config user.name "fotos-bot"
          git config user.email "fotos-bot@users.noreply.github.com"
          git add -A img/tipos img/candidatos redesign/tipos.json creditos-imagenes.html 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nada nuevo."; exit 0; fi
          git commit -q -m "Fotos ilustrativas: $(ls img/tipos/*.webp | wc -l) fotos"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
